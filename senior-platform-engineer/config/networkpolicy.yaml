apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cjpod-controller
  namespace: cjpod-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cjpod-controller
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
