apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cjpods.interview.cj.dev
spec:
  group: interview.cj.dev
  names:
    kind: CjPod
    listKind: CjPodList
    plural: cjpods
    singular: cjpod
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [template]
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: spec is immutable; create a new CjPod for another run
              properties:
                template:
                  type: object
                  required: [spec]
                  properties:
                    metadata:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    spec:
                      type: object
                      required: [containers]
                      x-kubernetes-preserve-unknown-fields: true
                      properties:
                        containers:
                          type: array
                          minItems: 1
                          items:
                            type: object
                            required: [name, image]
                            x-kubernetes-preserve-unknown-fields: true
                            properties:
                              name:
                                type: string
                                minLength: 1
                              image:
                                type: string
                                minLength: 1
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Running, Deleting, Completed]
                podUID:
                  type: string
                startedAt:
                  type: string
                  format: date-time
                completedAt:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [lastTransitionTime, message, reason, status, type]
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                        maxLength: 32768
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 1024
                      status:
                        type: string
                        enum: ["True", "False", Unknown]
                      type:
                        type: string
                        minLength: 1
                        maxLength: 316
