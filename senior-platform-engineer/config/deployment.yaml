apiVersion: v1
kind: Namespace
metadata:
  name: cjpod-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cjpod-controller
  namespace: cjpod-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cjpod-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cjpod-controller
    spec:
      serviceAccountName: cjpod-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: cjpod-controller
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cjpod-controller
      containers:
        - name: manager
          # Local-development placeholder. INSTALL.md requires a registry digest
          # override before installing this manifest in a production cluster.
          image: cjpod-controller:latest
          imagePullPolicy: IfNotPresent
          args: [--leader-elect]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
