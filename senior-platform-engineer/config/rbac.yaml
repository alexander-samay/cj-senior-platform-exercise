apiVersion: v1
kind: ServiceAccount
metadata:
  name: cjpod-controller
  namespace: cjpod-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cjpod-controller
rules:
  - apiGroups: [interview.cj.dev]
    resources: [cjpods]
    verbs: [get, list, watch]
  - apiGroups: [interview.cj.dev]
    resources: [cjpods/status]
    verbs: [get, patch, update]
  - apiGroups: [interview.cj.dev]
    resources: [cjpods/finalizers]
    verbs: [update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete, get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create, delete, get, list, patch, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cjpod-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cjpod-controller
subjects:
  - kind: ServiceAccount
    name: cjpod-controller
    namespace: cjpod-system
